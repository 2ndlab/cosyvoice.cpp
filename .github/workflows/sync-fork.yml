name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/Lourdle/cosyvoice.cpp.git

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream and check for changes
        id: check
        run: |
          git remote add upstream ${{ env.UPSTREAM_REPO }}
          git fetch upstream
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          ORIGIN_SHA=$(git rev-parse origin/main)
          if [ "$UPSTREAM_SHA" != "$ORIGIN_SHA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync fork using GitHub CLI
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main
